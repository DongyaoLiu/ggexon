  - annotate_cross_panel
  - link_panels
  - set_panel_xlim
  - clear_panel_xlim
  - effective_panel_windows

- title: Draw genomic and protein features
  desc: User-facing geoms for annotation tracks, links, motifs, trees, and mutation summaries.
  contents:
  - geom_exon
  - geom_exon2
  - geom_genetag
  - geom_genelabel
  - geom_genomic_tree
  - geom_motif
  - geom_mutation_label
  - geom_nuclink
  - geom_protein_lollipop

