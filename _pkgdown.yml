url: https://dongyaoliu.github.io/ggexon/

home:
  title: Grammar of genomic annotations, synteny, and associated data
  description: >
    ggexon is a ggplot2 extension for drawing genomic annotations, synteny,
    alignments, protein features, mutation summaries, and associated track data.

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  bslib:
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "Source Code Pro"}

navbar:
  structure:
    left: [intro, articles, reference]
    right: [search, github]
  components:
    articles:
      text: Tutorials
      menu:
      - text: Complete workflow
        href: articles/ggexon-workflow.html
      - text: Classes and verbs
        href: articles/ggexon-classes-and-verbs.html

articles:
- title: Learn ggexon
  navbar: ~
  contents:
  - ggexon-workflow
  - ggexon-classes-and-verbs

reference:
- title: Start a plot
  desc: Build ggexon plots, arrange genomic panels, and set genomic scales.
  contents:
  - ggexon
  - facet_genomics
  - facet_genomictree
  - scale_x_ggexon_genomic
  - guide_x_ggexon_piecewise
  - sec_axis
