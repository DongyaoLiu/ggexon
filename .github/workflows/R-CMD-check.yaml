name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-pandoc@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
      - uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Install and verify PDF manual dependencies
        shell: Rscript {0}
        run: |
          tinytex::tlmgr_install(c("courier", "makeindex"))
          for (font in c("pcrr8t.tfm", "pcrr8c.tfm")) {
            path <- system2("kpsewhich", font, stdout = TRUE)
            stopifnot(length(path) == 1L, file.exists(path))
          }
          stopifnot(nzchar(Sys.which("makeindex")))
      - name: Verify Windows PDF indexing
        if: runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          print(Sys.which(c("pdflatex", "makeindex", "texi2dvi", "texify")))
          dir <- tempfile("pdf-index-check-")
          dir.create(dir)
          setwd(dir)
          writeLines(c(
            "\\documentclass{article}", "\\usepackage{makeidx}",
            "\\makeindex", "\\begin{document}",
            "Index smoke test\\index{smoke test}.",
            "\\printindex", "\\end{document}"
          ), "index-check.tex")
          tools::texi2pdf("index-check.tex", clean = FALSE, quiet = FALSE)
          stopifnot(file.exists("index-check.ind"))
      - uses: r-lib/actions/check-r-package@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
        with:
          args: 'c("--as-cran")'
          build_args: 'character()'
          error-on: '"warning"'
